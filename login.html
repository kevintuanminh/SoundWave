<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoundWave - Đăng nhập</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-page" id="loginPage">
  <div class="login-form-wrap">
    <div class="login-form-inner">
      <div class="login-logo">
        <div class="login-logo-icon"><i class="fa-solid fa-music"></i></div>
        <span>SoundWave</span>
      </div>
      
      <!-- Form Đăng nhập -->
      <div id="loginForm">
        <h2 class="login-title">Chào mừng trở lại!</h2>
        <p class="login-sub">Đăng nhập để tiếp tục nghe nhạc.</p>

        <div class="form-group">
          <label>Email hoặc tên người dùng</label>
          <input type="text" id="loginUsername" placeholder="example@email.com">
        </div>
        
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="loginPassword" placeholder="••••••••">
        </div>
        
        <div class="form-row">
          <a href="#" class="forgot" id="forgotBtn">Quên mật khẩu?</a>
        </div>
        
        <button class="btn-login" id="loginBtn">Đăng nhập</button>

        <div class="login-footer">
          Chưa có tài khoản? <a href="register.html" id="showRegisterBtn">Đăng ký miễn phí</a>
        </div>
      </div>

      <!-- Modal Quên mật khẩu -->
      <div id="forgotModal" class="modal" style="display: none;">
        <div class="modal-content">
          <div class="modal-header">
            <h3>Quên mật khẩu</h3>
            <span class="close-modal" id="closeModalBtn">&times;</span>
          </div>
          <div class="modal-body">
            <p>Nhập email của bạn để nhận hướng dẫn đặt lại mật khẩu.</p>
            <div class="form-group">
              <input type="email" id="forgotEmail" placeholder="Email của bạn">
            </div>
            <button class="btn-login" id="resetPasswordBtn">Gửi yêu cầu</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
