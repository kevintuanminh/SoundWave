<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoundWave - Đăng ký</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="login-page" id="registerPage">
  <div class="login-form-wrap">
    <div class="login-form-inner">
      <div class="login-logo">
        <div class="login-logo-icon"><i class="fa-solid fa-music"></i></div>
        <span>SoundWave</span>
      </div>
      
      <!-- Form Đăng ký -->
      <div id="registerForm">
        <h2 class="login-title">Tạo tài khoản mới</h2>
        <p class="login-sub">Đăng ký để trải nghiệm âm nhạc không giới hạn.</p>

        <div class="form-group">
          <label>Tên người dùng</label>
          <input type="text" id="regUsername" placeholder="username" autocomplete="off">
        </div>
        
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="example@email.com" autocomplete="off">
        </div>
        
        <div class="form-group">
          <label>Mật khẩu</label>
          <input type="password" id="regPassword" placeholder="••••••••" autocomplete="new-password">
        </div>
        
        <div class="form-group">
          <label>Xác nhận mật khẩu</label>
          <input type="password" id="regConfirmPassword" placeholder="••••••••" autocomplete="new-password">
        </div>
        
        <button class="btn-login" id="registerBtn">Đăng ký</button>

        <div class="login-footer">
          Đã có tài khoản? <a href="login.html" id="showLoginBtn">Đăng nhập ngay</a>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
