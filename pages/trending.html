<div>
  <div class="section-header">
    <div class="section-title" id="trendingTitle">🔥 Bảng xếp hạng Thịnh hành</div>
  </div>

  <div class="top-songs-list">
    <div id="trendingSongsList">
      <div style="padding:2rem;text-align:center;color:var(--text3)">Đang tải danh sách...</div>
    </div>
  </div>
</div>

<script>
(function() {
  const allSongs = window.SONGS_DATA || [];
  const activeGenre = window._genreFilter || 'all';
  const el = document.getElementById('trendingSongsList');
  const titleEl = document.getElementById('trendingTitle');
  if (!el) return;

  let songs = [...allSongs];
  if (activeGenre !== 'all') {
    songs = songs.filter(s => s.genre === activeGenre);
    if (titleEl) titleEl.textContent = `🔥 Tất cả nhạc ${activeGenre.toUpperCase()}`;
  } else {
    songs = songs.sort((a, b) => (a.rank || 99) - (b.rank || 99));
    if (titleEl) titleEl.textContent = '🔥 Bảng xếp hạng Thịnh hành';
  }

  if (window.updateTrendingSongs) window.updateTrendingSongs(songs);

  if (songs.length === 0) {
    el.innerHTML = '<div style="padding:3rem;text-align:center;color:var(--text3)">Chưa có bài hát nào trong thể loại này</div>';
    return;
  }

  el.innerHTML = songs.map((s, i) => {
    const thumbContent = s.image 
      ? `<img src="${s.image}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`
      : '🎵';
    return `
    <div class="song-item" data-song='${JSON.stringify(s).replace(/'/g, "&apos;")}'>
      <div class="song-rank${i<3?' top':''}">${i + 1}</div>
      <div class="song-thumb" style="background:${s.bg}">${thumbContent}<div class="song-play-overlay">▶</div></div>
      <div class="song-info">
        <div class="song-name">${s.name}</div>
        <div class="song-artist">${s.artist}</div>
      </div>
      <div class="song-meta">
        <span class="add-to-playlist-btn" data-song='${JSON.stringify(s).replace(/'/g, "&apos;")}' style="cursor:pointer;margin:0 8px">➕</span>
        <span class="like-song-btn ${window.isLiked&&window.isLiked(s)?'liked':''}" data-song='${JSON.stringify(s).replace(/'/g, "&apos;")}' style="cursor:pointer;margin:0 4px">${window.isLiked&&window.isLiked(s)?'❤️':'🤍'}</span>
      </div>
    </div>`;
  }).join('');

  el.querySelectorAll('.song-item').forEach(item => {
    item.addEventListener('click', e => {
      if (e.target.classList.contains('add-to-playlist-btn') || e.target.classList.contains('like-song-btn')) return;
      if (window.playSongFromMain) window.playSongFromMain(JSON.parse(item.dataset.song));
    });
  });

  el.querySelectorAll('.add-to-playlist-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      if (window.showAddToPlaylistModal) window.showAddToPlaylistModal(JSON.parse(btn.dataset.song));
    });
  });

  el.querySelectorAll('.like-song-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const s = JSON.parse(btn.dataset.song);
      if (window.toggleLike) {
        window.toggleLike(s);
        btn.textContent = window.isLiked(s) ? '❤️' : '🤍';
        btn.classList.toggle('liked');
      }
    });
  });
})();
</script>
