<div>
  <!-- MOBILE GENRE TAGS -->
  <div class="mobile-genres-row">
    <div class="genre-tag active" data-genre="all"><i class="fa-solid fa-house"></i> Tất cả</div>
    <div class="genre-tag" data-genre="vpop"><i class="fa-solid fa-microphone"></i> V-Pop</div>
    <div class="genre-tag" data-genre="pop"><i class="fa-solid fa-guitar"></i> Pop</div>
    <div class="genre-tag" data-genre="chill"><i class="fa-solid fa-leaf"></i> Chill</div>
    <div class="genre-tag" data-genre="lofi"><i class="fa-solid fa-mug-hot"></i> Lofi</div>
    <div class="genre-tag" data-genre="remix"><i class="fa-solid fa-bolt-lightning"></i> Remix</div>
    <div class="genre-tag" data-genre="indie"><i class="fa-solid fa-sun"></i> Indie</div>
    <div class="genre-tag" data-genre="rap"><i class="fa-solid fa-microphone-lines"></i> Rap</div>
    <div class="genre-tag" id="mobileMoreGenreBtn" style="background:rgba(192,132,252,0.1);color:var(--accent);border-color:rgba(192,132,252,0.3)"><i class="fa-solid fa-plus"></i></div>
  </div>

  <!-- HERO BANNER -->
  <div class="hero-banner" id="heroBanner">
    <div class="hero-text">
      <div class="hero-tag"><i class="fa-solid fa-music"></i> Dành cho bạn</div>
      <h2 id="heroTitle">Top 10 Thịnh Hành</h2>
      <p id="heroDesc">Khám phá ngay những bài hát đang dẫn đầu bảng xếp hạng trên SoundWave.</p>
      <div class="hero-btns">
        <button class="btn-primary" id="heroPlayBtn"><i class="fa-solid fa-play"></i> Phát ngay</button>
        <button class="btn-ghost" id="heroShuffleBtn"><i class="fa-solid fa-shuffle"></i> Shuffle</button>
      </div>
    </div>
    <div class="hero-visual">
      <div class="hero-album-stack">
        <div class="ha" style="background:linear-gradient(135deg,#1a0a3e,#2a1a5e);left:40px;top:0;transform:rotate(8deg)"><i class="fa-solid fa-microphone"></i></div>
        <div class="ha" style="background:linear-gradient(135deg,#0a1a2e,#1a2a4e);left:15px;top:12px;transform:rotate(-3deg)"><i class="fa-solid fa-music"></i></div>
        <div class="ha" style="background:linear-gradient(135deg,#0a2e1a,#1a4e2a);left:0;top:22px;transform:rotate(-12deg)"><i class="fa-solid fa-guitar"></i></div>
      </div>
    </div>
  </div>

  <!-- TOP SONGS -->
  <div class="top-songs">
    <div class="section-header">
      <div class="section-title" id="topSongsTitle"><i class="fa-solid fa-fire"></i> Top 10 Thịnh Hành</div>
      <a href="#" class="see-all" id="seeAllBtn">Xem tất cả <i class="fa-solid fa-arrow-right"></i></a>
    </div>
    <div id="topSongsList">
       <!-- Dữ liệu sẽ được nạp từ main.js -->
       <div style="padding:2rem;text-align:center;color:var(--text3)">Đang tải danh sách...</div>
    </div>
  </div>

  <!-- HISTORY -->
  <div class="history-section">
    <div class="section-header">
      <div class="section-title"><i class="fa-solid fa-clock-rotate-left"></i> Nghe gần đây</div>
      <a href="#" class="see-all" id="clearHistoryBtn">Xóa lịch sử</a>
    </div>
    <div id="historyList"></div>
  </div>

  <!-- ALBUMS -->
  <div class="albums-section">
    <div class="section-header">
      <div class="section-title"><i class="fa-solid fa-compact-disc"></i> Album nổi bật</div>
    </div>
    <div class="album-grid" id="albumGrid"></div>
  </div>
</div>
