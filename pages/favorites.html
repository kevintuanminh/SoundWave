<div>
  <div class="section-header">
    <div class="section-title">❤️ Bài hát yêu thích</div>
    <span id="likedCount" style="font-size:0.85rem;color:var(--text3)">0 bài</span>
  </div>

  <div id="noLiked" style="display:none;text-align:center;padding:4rem 2rem">
    <div style="font-size:4rem;margin-bottom:1rem">🤍</div>
    <div style="font-size:1.1rem;font-weight:600;margin-bottom:0.5rem">Chưa có bài yêu thích</div>
    <div style="color:var(--text2);font-size:0.9rem">Nhấn 🤍 trên bài hát để thêm vào đây</div>
  </div>

  <div class="top-songs" id="favoritesList"></div>
</div>

<script>
(function() {
  function build() {
    const liked = JSON.parse(localStorage.getItem('likedSongs')) || [];
    const el = document.getElementById('favoritesList');
    const noEl = document.getElementById('noLiked');
    const countEl = document.getElementById('likedCount');
    if (!el) return;

    if (countEl) countEl.textContent = liked.length + ' bài';

    if (liked.length === 0) {
      if (noEl) noEl.style.display = 'block';
      el.innerHTML = '';
      return;
    }
    if (noEl) noEl.style.display = 'none';

    el.innerHTML = liked.map((s, i) => {
      const thumbContent = s.image 
        ? `<img src="${s.image}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`
        : '🎵';
      return `
      <div class="song-item" data-song='${JSON.stringify(s)}'>
        <div class="song-rank">${i + 1}</div>
        <div class="song-thumb" style="background:${s.bg || '#1a0a2e'}">${thumbContent}<div class="song-play-overlay">▶</div></div>
        <div class="song-info"><div class="song-name">${s.name}</div><div class="song-artist">${s.artist}</div></div>
        <div class="song-meta">
          <span class="song-duration">${s.dur || ''}</span>
          <span class="unlike-btn" data-idx="${i}" style="cursor:pointer;margin-left:12px;font-size:1.1rem" title="Bỏ yêu thích">❤️</span>
        </div>
      </div>`;
    }).join('');

    el.querySelectorAll('.song-item').forEach(item => {
      item.addEventListener('click', e => {
        if (e.target.classList.contains('unlike-btn')) return;
        if (window.playSongFromMain) window.playSongFromMain(JSON.parse(item.dataset.song));
      });
    });
    el.querySelectorAll('.unlike-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const s = JSON.parse(btn.closest('.song-item').dataset.song);
        if (window.toggleLike) { window.toggleLike(s); build(); }
      });
    });
  }
  build();
})();
</script>
