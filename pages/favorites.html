<div>
  <div class="section-header">
    <div class="section-title"><i class="fa-solid fa-heart" style="color:var(--accent)"></i> Bài hát yêu thích</div>
    <span id="likedCount" style="font-size:0.85rem;color:var(--text3)">0 bài</span>
  </div>

  <div id="noLiked" style="display:none;text-align:center;padding:4rem 2rem">
    <div style="font-size:4rem;margin-bottom:1rem;color:var(--text3)"><i class="fa-regular fa-heart"></i></div>
    <div style="font-size:1.1rem;font-weight:600;margin-bottom:0.5rem">Chưa có bài yêu thích</div>
    <div style="color:var(--text2);font-size:0.9rem">Nhấn <i class="fa-regular fa-heart"></i> trên bài hát để thêm vào đây</div>
  </div>

  <div class="top-songs" id="favoritesList"></div>
</div>

<script>
(function() {
  function build() {
    const key = window.getStorageKey ? window.getStorageKey('favorites') : 'favorites_guest';
    const favorites = JSON.parse(localStorage.getItem(key)) || [];
    const el = document.getElementById('favoritesList');
    const noEl = document.getElementById('noLiked');
    const countEl = document.getElementById('likedCount');
    if (!el) return;

    if (countEl) countEl.textContent = favorites.length + ' bài';

    if (favorites.length === 0) {
      if (noEl) noEl.style.display = 'block';
      el.innerHTML = '';
      return;
    }
    if (noEl) noEl.style.display = 'none';

    el.innerHTML = favorites.map((s, i) => {
      const thumbContent = s.image 
        ? `<img src="${s.image}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`
        : '<i class="fa-solid fa-music"></i>';
      return `
      <div class="song-item" data-song='${JSON.stringify(s).replace(/'/g, "&apos;")}'>
        <div class="song-rank">${i + 1}</div>
        <div class="song-thumb" style="background:${s.bg || '#1a0a2e'}">${thumbContent}<div class="song-play-overlay"><i class="fa-solid fa-play"></i></div></div>
        <div class="song-info"><div class="song-name">${window.escapeHtml(s.name)}</div><div class="song-artist">${window.escapeHtml(s.artist)}</div></div>
        <div class="song-meta">
          <span class="song-duration">${s.dur || ''}</span>
          <span class="unlike-btn" data-idx="${i}" style="cursor:pointer;margin-left:12px;font-size:1.1rem;color:var(--accent)" title="Bỏ yêu thích"><i class="fa-solid fa-heart"></i></span>
        </div>
      </div>`;
    }).join('');

    el.querySelectorAll('.song-item').forEach(item => {
      item.addEventListener('click', e => {
        if (e.target.closest('.unlike-btn')) return;
        if (window.playSongFromMain) window.playSongFromMain(JSON.parse(item.dataset.song));
      });
    });
    el.querySelectorAll('.unlike-btn').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const s = JSON.parse(btn.closest('.song-item').dataset.song);
        if (window.toggleLike) { window.toggleLike(s); build(); }
      });
    });
  }
  build();
})();
</script>
