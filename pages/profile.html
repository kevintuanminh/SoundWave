<div>
  <div class="section-header">
    <div class="section-title"><i class="fa-solid fa-circle-user"></i> Hồ sơ cá nhân</div>
  </div>

  <div class="profile-wrap" id="profileWrap">
    <!-- Nội dung sẽ được render bằng JS -->
  </div>
</div>

<script>
(function() {
  const username = localStorage.getItem('username') || 'Khách';
  const users = JSON.parse(localStorage.getItem('users')) || [];
  const user = users.find(u => u.username === username) || { username, email: 'Chưa đăng nhập' };
  const favorites = JSON.parse(localStorage.getItem('favorites')) || [];
  const playlists = JSON.parse(localStorage.getItem('userPlaylists')) || [];
  const history = JSON.parse(localStorage.getItem('listenHistory')) || [];
  const isLoggedIn = localStorage.getItem('username') && localStorage.getItem('username') !== 'Người dùng';

  document.getElementById('profileWrap').innerHTML = `
    <div class="profile-card">
      <div class="profile-avatar">${(username[0]||'?').toUpperCase()}</div>
      <div class="profile-info">
        <div class="profile-username">${username}</div>
        <div class="profile-email">${user.email || ''}</div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num">${history.length}</div><div class="stat-label">Bài đã nghe</div></div>
      <div class="stat-card"><div class="stat-num">${favorites.length}</div><div class="stat-label">Yêu thích</div></div>
      <div class="stat-card"><div class="stat-num">${playlists.length}</div><div class="stat-label">Playlist</div></div>
    </div>

    ${isLoggedIn ? `
    <div class="profile-section">
      <div class="profile-section-title"><i class="fa-solid fa-lock"></i> Đổi mật khẩu</div>
      <div class="form-group" style="max-width:360px">
        <label style="font-size:0.85rem;color:var(--text2);display:block;margin-bottom:6px">Mật khẩu mới</label>
        <input type="password" id="newPwdInput" placeholder="Nhập mật khẩu mới" style="width:100%;padding:0.7rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:0.9rem;margin-bottom:10px">
        <label style="font-size:0.85rem;color:var(--text2);display:block;margin-bottom:6px">Xác nhận mật khẩu</label>
        <input type="password" id="confirmPwdInput" placeholder="Nhập lại mật khẩu" style="width:100%;padding:0.7rem 1rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:0.9rem;margin-bottom:12px">
        <button id="changePwdBtn" style="padding:0.7rem 1.5rem;background:linear-gradient(135deg,#c084fc,#818cf8);border:none;border-radius:10px;color:#fff;font-weight:600;cursor:pointer">Đổi mật khẩu</button>
      </div>
    </div>

    <div class="profile-section">
      <div class="profile-section-title"><i class="fa-solid fa-triangle-exclamation"></i> Vùng nguy hiểm</div>
      <button id="logoutProfileBtn" style="padding:0.6rem 1.2rem;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);border-radius:10px;color:#f87171;cursor:pointer"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
    </div>` : `
    <div style="text-align:center;padding:2rem">
      <button onclick="window.location.href='login.html'" style="padding:0.8rem 2rem;background:linear-gradient(135deg,#c084fc,#818cf8);border:none;border-radius:30px;color:#fff;font-weight:600;cursor:pointer;font-size:1rem"><i class="fa-solid fa-key"></i> Đăng nhập để xem đầy đủ</button>
    </div>`}
  `;

  // Đổi mật khẩu
  document.getElementById('changePwdBtn')?.addEventListener('click', () => {
    const np = document.getElementById('newPwdInput')?.value;
    const cp = document.getElementById('confirmPwdInput')?.value;
    if (!np || np.length < 6) { if(window.showToast) window.showToast('Mật khẩu phải ít nhất 6 ký tự!','error'); return; }
    if (np !== cp) { if(window.showToast) window.showToast('Mật khẩu không khớp!','error'); return; }
    const us = JSON.parse(localStorage.getItem('users')) || [];
    const u = us.find(u => u.username === username);
    if (u) { u.password = np; localStorage.setItem('users', JSON.stringify(us)); if(window.showToast) window.showToast('Đổi mật khẩu thành công!'); }
  });
  document.getElementById('logoutProfileBtn')?.addEventListener('click', () => {
    if (confirm('Đăng xuất?')) { localStorage.removeItem('username'); window.location.href='login.html'; }
  });
})();
</script>
