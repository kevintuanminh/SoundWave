<div>
  <div class="section-header">
    <div class="section-title"><i class="fa-solid fa-circle-user"></i> Hồ sơ cá nhân</div>
  </div>

  <div class="profile-wrap" id="profileWrap">
    <!-- Nội dung sẽ được render bằng JS -->
  </div>
</div>

<script>
(function() {
  const username = localStorage.getItem('username') || 'Khách';
  const users = JSON.parse(localStorage.getItem('users')) || [];
  const user = users.find(u => u.username === username) || { username, email: 'Chưa đăng nhập' };
  
  const favKey = window.getStorageKey ? window.getStorageKey('favorites') : 'favorites_guest';
  const playlistKey = window.getStorageKey ? window.getStorageKey('userPlaylists') : 'userPlaylists_guest';
  const histKey = window.getStorageKey ? window.getStorageKey('listenHistory') : 'listenHistory_guest';

  const favorites = JSON.parse(localStorage.getItem(favKey)) || [];
  const playlists = JSON.parse(localStorage.getItem(playlistKey)) || [];
  const history = JSON.parse(localStorage.getItem(histKey)) || [];
  const isLoggedIn = localStorage.getItem('username') && localStorage.getItem('username') !== 'Người dùng';

  document.getElementById('profileWrap').innerHTML = `
    <div class="profile-card">
      <div class="profile-avatar">${(username[0]||'?').toUpperCase()}</div>
      <div class="profile-info">
        <div class="profile-username">${username}</div>
        <div class="profile-email">${user.email || ''}</div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="stat-num">${history.length}</div><div class="stat-label">Bài đã nghe</div></div>
      <div class="stat-card"><div class="stat-num">${favorites.length}</div><div class="stat-label">Yêu thích</div></div>
      <div class="stat-card"><div class="stat-num">${playlists.length}</div><div class="stat-label">Playlist</div></div>
    </div>

    ${isLoggedIn ? `
    <div class="profile-section">
      <div class="profile-section-title"><i class="fa-solid fa-lock"></i> Bảo mật</div>
      <button id="openChangePwdBtn" style="padding:0.7rem 1.5rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-weight:600;cursor:pointer;transition:all 0.2s"><i class="fa-solid fa-key"></i> Đổi mật khẩu</button>
    </div>

    <div class="profile-section">
      <div class="profile-section-title"><i class="fa-solid fa-triangle-exclamation"></i> Vùng nguy hiểm</div>
      <button id="logoutProfileBtn" style="padding:0.6rem 1.2rem;background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);border-radius:10px;color:#f87171;cursor:pointer"><i class="fa-solid fa-right-from-bracket"></i> Đăng xuất</button>
    </div>` : `
    <div style="text-align:center;padding:2rem">
      <button onclick="window.location.href='login.html'" style="padding:0.8rem 2rem;background:linear-gradient(135deg,#c084fc,#818cf8);border:none;border-radius:30px;color:#fff;font-weight:600;cursor:pointer;font-size:1rem"><i class="fa-solid fa-key"></i> Đăng nhập để xem đầy đủ</button>
    </div>`}
  `;

  // Mở modal đổi mật khẩu
  document.getElementById('openChangePwdBtn')?.addEventListener('click', () => {
    if (window.openChangePwdModal) window.openChangePwdModal();
  });
  document.getElementById('logoutProfileBtn')?.addEventListener('click', () => {
    if (confirm('Đăng xuất?')) { localStorage.removeItem('username'); window.location.href='login.html'; }
  });
})();
</script>
