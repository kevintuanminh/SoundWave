<div>
  <div class="section-header">
    <div class="section-title"><i class="fa-solid fa-microphone-lines"></i> Nghệ sĩ nổi bật</div>
  </div>

  <div class="artist-grid" id="artistGrid"></div>

  <div id="artistSongs" style="display:none">
    <div class="section-header" style="margin-top:2rem">
      <div class="section-title" id="artistSongsTitle">Bài hát</div>
      <a href="#" class="see-all" id="backToArtists"><i class="fa-solid fa-arrow-left"></i> Quay lại</a>
    </div>
    <div class="top-songs" id="artistSongsList"></div>
  </div>
</div>

<script>
(function() {
  const artists = window.ARTISTS_DATA || [];
  const allSongs = window.SONGS_DATA || [];

  function buildArtists() {
    const el = document.getElementById('artistGrid');
    const songsEl = document.getElementById('artistSongs');
    if (el) el.style.display = 'grid';
    if (songsEl) songsEl.style.display = 'none';
    if (!el) return;
    el.innerHTML = artists.map(a => {
      const avatarContent = a.image 
        ? `<img src="${a.image}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`
        : '<i class="fa-solid fa-user"></i>';
      return `
      <div class="artist-card" data-artist="${a.name}">
        <div class="artist-avatar" style="background:${a.bg}">${avatarContent}</div>
        <div class="artist-name">${a.name}</div>
        <div class="artist-genre">${a.genre}</div>
      </div>`;
    }).join('');
    el.querySelectorAll('.artist-card').forEach(card => {
      card.addEventListener('click', () => showArtistSongs(card.dataset.artist));
    });
  }

  function showArtistSongs(artistName) {
    const el = document.getElementById('artistGrid');
    const songsEl = document.getElementById('artistSongs');
    const title = document.getElementById('artistSongsTitle');
    const list = document.getElementById('artistSongsList');
    if (el) el.style.display = 'none';
    if (songsEl) songsEl.style.display = 'block';
    if (title) title.innerHTML = `<i class="fa-solid fa-microphone"></i> ${artistName}`;

    const songs = allSongs.filter(s => s.artist.includes(artistName.split(' ')[0]));
    if (!list) return;
    if (songs.length === 0) {
      list.innerHTML = '<div style="text-align:center;padding:2rem;color:var(--text2)">Chưa có bài hát nào</div>';
      return;
    }
    list.innerHTML = songs.map((s, i) => {
      const thumbContent = s.image 
        ? `<img src="${s.image}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;">`
        : '<i class="fa-solid fa-music"></i>';
      return `
      <div class="song-item" data-song='${JSON.stringify(s).replace(/'/g, "&apos;")}'>
        <div class="song-rank">${i + 1}</div>
        <div class="song-thumb" style="background:${s.bg}">${thumbContent}<div class="song-play-overlay"><i class="fa-solid fa-play"></i></div></div>
        <div class="song-info"><div class="song-name">${s.name}</div><div class="song-artist">${s.artist}</div></div>
      </div>`;
    }).join('');
    list.querySelectorAll('.song-item').forEach(item => {
      item.addEventListener('click', () => { if (window.playSongFromMain) window.playSongFromMain(JSON.parse(item.dataset.song)); });
    });
  }

  buildArtists();
  document.getElementById('backToArtists')?.addEventListener('click', e => { e.preventDefault(); buildArtists(); });
})();
</script>
